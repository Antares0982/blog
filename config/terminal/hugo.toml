# hugo --environment terminal. Merged on top of config/_default/hugo.toml.
#
# `terminal-overlay` is this repo's layouts/ and static/ for this theme, staged
# under themes/ by nix/site.nix. Hugo takes theme components in priority order,
# so the overlay wins over the theme and the project's own layouts/ wins over
# both -- which is where the theme-agnostic templates live.
theme = ["terminal-overlay", "terminal"]

[markup]
  [markup.highlight]
    # Terminal ships its own syntax.css and expects Chroma classes, not inline
    # styles; `noClasses = true` would paint a light theme over its dark one.
    noClasses = false

[params]
  # Posts live in content/posts/, which is what the theme lists on the home
  # page. Everything in content/ root stays out of the stream, as under
  # WordPress; `hidden: true` keeps the same pages out of the feed.
  contentTypeName = "posts"
  # Terminal's default container is `max-width: 864px` with no auto margin, so
  # it sits flush against the left edge with a rule down its right side -- the
  # terminal-window look it is going for, which on a wide screen just reads as
  # a page that failed to lay out. This centres it and drops the rule. The 864px
  # measure stays; `fullWidthTheme` would remove it too, and full-width lines of
  # Chinese are unreadable.
  centerTheme = true
  dateFormat = "2006-01-02"
  showLastUpdated = true
  toc = true
  showLanguageSelector = true

  # `showMenuItems` is deliberately unset: Terminal's dropdown is an overflow
  # menu (the first N items inline, the rest under `menuMore`), and with four
  # entries there is nothing to overflow. Leaving it unset takes the theme's
  # other branch, which renders every item inline. Note its menu partial skips
  # any item with children outright, so a nested group is not an option here
  # even if the menu grows -- which is why this menu is flat and diary's is not.

  [params.logo]
    logoText = "α-Lyrae"
    logoHomeLink = "/"

# Terminal ships no i18n files: every UI string is a param, so they have to be
# set per language rather than translated. These sit here rather than in
# config/_default/languages.toml because they are this theme's vocabulary --
# diary carries its own i18n/zh.yaml and needs none of them.
[languages.zh.params]
  tocTitle = "目录"
  readMore = "继续阅读"
  readOtherPosts = "其他文章"
  newerPosts = "更新的文章"
  olderPosts = "更早的文章"
  updatedDatePrefix = "更新于"
  missingContentMessage = "页面不存在"
  missingBackButtonLabel = "回到首页"

# Only the two the theme has no fallback for. `readMore` and `readOtherPosts`
# are read as `{{ $.Site.Params.ReadMore }}` with no `default`, so leaving them
# unset renders an empty button rather than an English one. Everything else
# above falls back to the theme's own English.
[languages.en.params]
  readMore = "Read more"
  readOtherPosts = "Read other posts"

# Per language. English has one post and no pages, so its menu is just the
# home link -- Terminal renders no nav at all for a language with an empty
# menu, which reads as a broken header rather than a spare one.
[[languages.zh.menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1
[[languages.zh.menu.main]]
  identifier = "about"
  name = "简介"
  url = "/about/"
  weight = 2
[[languages.zh.menu.main]]
  identifier = "words"
  name = "杂谈"
  url = "/words/"
  weight = 3
[[languages.zh.menu.main]]
  identifier = "archive"
  name = "存档"
  url = "/archive/"
  weight = 4

[[languages.en.menu.main]]
  identifier = "home"
  name = "Home"
  url = "/en/"
  weight = 1
