# Shared by both themes. Hugo merges this with config/<theme>/hugo.toml, chosen
# by `hugo --environment <theme>`; nix/site.nix passes the flag. Anything that
# would read differently under diary than under terminal belongs over there,
# not here.
#
# baseURL is overridden by nix/site.nix (`hugo --baseURL`) so the same tree can
# be built for blog.chr.fan today and chr.fan after the cutover.
baseURL = "https://blog.chr.fan/"
copyright = "© Antares0982"
enableEmoji = true
# WordPress served every post at /<slug>/; keep those URLs.
uglyURLs = false

# Chinese is the default and is *not* pushed into /zh/, so every existing URL
# survives -- above all chr.fan/feed. Titles, subtitles, rssLanguage and
# hasCJKLanguage are per language now; see config/_default/languages.toml.
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/:slug/"

[markup]
  [markup.goldmark.renderer]
    # Posts came from wp-editormd and contain raw <del>/<blockquote>/<img> HTML.
    unsafe = true
  [markup.goldmark.extensions]
    # KaTeX handles the math client-side; Goldmark must not eat $...$ or the
    # backslashes inside it.
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['$', '$'], ['\(', '\)']]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  enableLaTeX = true
  # Historical view counts migrated from WordPress; the counter endpoint tops
  # them up live. Empty string disables the live call and shows the baseline.
  viewCounterEndpoint = "/api/views.json"

  # Announcements is the repo's built-in category and has exactly the format
  # giscus recommends: only maintainers and giscus itself can open discussions
  # in it, so nobody can seed the mapping with discussions of their own.
  enableGiscus = true

  # Link-preview card (Telegram, Twitter, Slack). terminal hardcodes
  # `og-image.png` in its head partial and ignores this; diary emits no og:image
  # at all unless Hugo's internal opengraph template finds it here. Both resolve
  # to static/og-image.png. Keep bare keys above any sub-table -- after one they
  # belong to it.
  images = ["og-image.png"]

  [params.giscus]
    data_repo = "Antares0982/blog"
    data_repo_id = "R_kgDOT_wEAA"
    data_category = "Announcements"
    data_category_id = "DIC_kwDOT_wEAM4DD4oE"
    # `specific` rather than `pathname`, with the term supplied per page by
    # each theme's comment partial; see the note there for why.
    data_mapping = "specific"
    data_strict = "1"
    data_reactions_enabled = "1"
    data_emit_metadata = "0"
    data_input_position = "bottom"
    data_theme = "preferred_color_scheme"
    data_lang = "zh-CN"
    # The snippet giscus.app hands you drops this attribute; the partial emits it.
    data_loading = "lazy"
    crossorigin = "anonymous"
