# hugo --environment diary. Merged on top of config/_default/hugo.toml.
# Kept as the comparison build; `packages.blog` is terminal. See config/terminal.
theme = ["diary-overlay", "diary"]

[markup]
  [markup.highlight]
    noClasses = true
    style = "perldoc"

[params]
  # terminal hardcodes favicon.png in its head partial; diary reads this param
  # and emits no icon link at all without it. Both land on static/favicon.png.
  # Keep bare keys above any sub-table -- after one they belong to it.
  favicon = "favicon.png"
  enableOpenGraph = true
  enableTwitterCards = false
  disableDarkmode = false

# diary renders a nested submenu, so 简介/杂谈/存档 sit under a group here
# rather than inline. Terminal cannot do this at all -- its menu partial skips
# any item that has children. Per language for the same reason as there.
[[languages.zh.menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1
[[languages.zh.menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 2
[[languages.zh.menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 3
[[languages.zh.menu.main]]
  identifier = "pages"
  name = "其他页面"
  url = "#"
  weight = 4
[[languages.zh.menu.main]]
  parent = "pages"
  name = "简介"
  url = "/about/"
  weight = 1
[[languages.zh.menu.main]]
  parent = "pages"
  name = "杂谈"
  url = "/words/"
  weight = 2
[[languages.zh.menu.main]]
  parent = "pages"
  name = "存档"
  url = "/archive/"
  weight = 3

[[languages.en.menu.main]]
  identifier = "home"
  name = "Home"
  url = "/en/"
  weight = 1
